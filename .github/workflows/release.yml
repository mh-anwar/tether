name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    # Oldest supported Ubuntu, so the binaries link against an older glibc and run on more distros.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev patchelf rpm pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace

      - name: Build release binaries
        run: cargo build --release -p tether -p tether-app

      - name: Stage daemon as Tauri sidecar
        run: |
          mkdir -p crates/tether-app/binaries
          cp target/release/tether crates/tether-app/binaries/tether-x86_64-unknown-linux-gnu

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build installers
        working-directory: crates/tether-app
        # linuxdeploy (AppImage) needs FUSE, which hosted runners lack.
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: npx --yes @tauri-apps/cli@2 build --config ../../packaging/tauri.release.json --bundles deb,rpm,appimage

      - name: Build plain tarball
        run: |
          STAGE=tether-linux-x86_64
          mkdir -p "$STAGE"
          cp target/release/tether target/release/tether-app packaging/install.sh crates/tether-app/icons/icon.png "$STAGE"/
          tar -czf tether-linux-x86_64.tar.gz "$STAGE"

      - name: Collect files
        run: |
          mkdir dist
          cp target/release/bundle/deb/*.deb target/release/bundle/rpm/*.rpm \
            target/release/bundle/appimage/*.AppImage tether-linux-x86_64.tar.gz dist/

      - uses: actions/upload-artifact@v4
        with:
          name: tether-linux
          if-no-files-found: error
          path: dist/*

  flatpak:
    runs-on: ubuntu-24.04
    # Flathub's builder image: flatpak-builder plus the GNOME runtime and SDK the manifest names.
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      # Vendored crate list for the offline build, made from this commit's Cargo.lock.
      - name: Generate cargo sources
        run: packaging/flatpak/cargo-sources.sh

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/io.github.mh_anwar.Tether.yml
          bundle: Tether-x86_64.flatpak
          cache-key: flatpak-builder-${{ hashFiles('Cargo.lock') }}
          upload-artifact: false

      # Tether runs these programs; inside the sandbox only the runtime's copies exist. The log says
      # which are missing, so docs/flathub.md can say which features need work there.
      - name: Programs in the runtime
        continue-on-error: true
        run: |
          flatpak run --command=sh org.gnome.Platform//50 -c \
            'for p in pactl paplay pw-play canberra-gtk-play sftp xdg-open loginctl dotool; do
               command -v "$p" || echo "missing: $p"; done'

      - uses: actions/upload-artifact@v4
        with:
          name: tether-flatpak
          if-no-files-found: error
          path: Tether-x86_64.flatpak

  publish:
    needs: [linux, flatpak]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # The updater installs only files whose hash matches this list (crates/tether/src/update.rs).
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: tether-release
          path: dist/*

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
