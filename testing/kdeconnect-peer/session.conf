<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Session bus without service activation: kdeconnectd is started by the entrypoint only, so an early
     kdeconnect-cli call can't auto-spawn a second daemon (which made the first one exit as a duplicate). -->
<busconfig>
  <type>session</type>
  <listen>unix:path=/tmp/runtime-peer/bus</listen>
  <policy context="default">
    <allow send_destination="*" eavesdrop="true"/>
    <allow eavesdrop="true"/>
    <allow own="*"/>
  </policy>
</busconfig>
