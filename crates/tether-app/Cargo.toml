[package]
name = "tether-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "tether-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri: the window, using the system WebKitGTK so the binary stays small.
tauri = { version = "2", features = ["protocol-asset"] }
# Clipboard for "copy code" and pasting into the phone; works on X11 and Wayland.
arboard = { version = "3", default-features = false, features = ["wayland-data-control", "image-data"] }
anyhow.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
dirs.workspace = true

# Native multi-file chooser; GTK is already required by the Linux window.
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }
