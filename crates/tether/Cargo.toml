[package]
name = "tether"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tether-core = { path = "../tether-core" }
anyhow.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
dirs.workspace = true
notify-rust.workspace = true
# Phone screenshots onto the clipboard: decode the phone's PNG or JPEG (Samsung saves JPEG).
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Clipboard sync in the background service; same features as tether-app so builds share it.
arboard = { version = "3", default-features = false, features = ["wayland-data-control", "image-data"] }
# The phone's media player on the desktop's D-Bus (media keys). Already built for notify-rust.
zbus = { version = "6", default-features = false, features = ["default-rt", "proxy", "service"] }
# Phone apps: QR code for wireless-debugging pairing (no image deps), helper checksum, random secrets.
qrcode = { version = "0.14", default-features = false }
sha2.workspace = true
hex.workspace = true
uuid.workspace = true
# Phone apps: bind our own port 5353 next to avahi (SO_REUSEADDR) to ask the phone directly.
socket2.workspace = true
# Tray icon on bars with the older XEmbed tray (i3bar, polybar). Already built for arboard.
x11rb = { version = "0.13", features = ["xtest"] }
